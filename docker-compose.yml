services:
  # 1. THE DATA LAYER (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: analytics_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./csv_data:/tmp/my_csv_files
    networks:
      - analytics_network

  # 2. THE SEMANTIC LAYER (Cube.dev)
  cube:
    image: cubejs/cube:v0.35
    container_name: analytics_cube
    restart: always
    ports:
      - "4000:4000"     # REST API
      - "15432:15432"   # SQL API
    volumes:
      - .:/cube/conf
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: analytics_db
      CUBEJS_DB_USER: admin
      CUBEJS_DB_PASS: password123
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: super_secret_key_change_me_later
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: admin_cube
      CUBEJS_SQL_PASSWORD: cubepassword123
      CUBEJS_BIND_ADDRESS: "0.0.0.0"      # Force Cube to listen to outer requests
    depends_on:
      - postgres
    networks:
      - analytics_network

  # 3. THE VISUALIZATION LAYER (Metabase)
  metabase:
    image: metabase/metabase:v0.50.4
    container_name: analytics_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - cube
    networks:
      - analytics_network

  # 4. THE NODE APPLICATION ORCHESTRATOR LAYER
  app:
    build: .
    container_name: analytics_node_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 8000
      # 🎯 VERIFY THIS MATCHES PRECISELY:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1/load
      CUBE_API_TOKEN: super_secret_key_change_me_later
      ANTHROPIC_API_KEY: sk-ant-your_actual_claude_api_key_here
    depends_on:
      - cube
    networks:
      - analytics_network
# Dedicated high-speed network bridge definition
networks:
  analytics_network:
    driver: bridge

# Persistent storage maps
volumes:
  pgdata:
  mbdata:
