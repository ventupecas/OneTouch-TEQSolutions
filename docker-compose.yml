services:
  # 1. THE DATA LAYER (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: analytics_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"

  # 2. THE SEMANTIC LAYER (Cube.dev)
  cube:
    image: cubejs/cube:v0.35
    container_name: analytics_cube
    restart: always
    network_mode: "host"           # 🎯 FORCE HOST MODE HERE
    volumes:
      - .:/cube/conf
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: 127.0.0.1    # Target local machine port route directly
      CUBEJS_DB_NAME: analytics_db
      CUBEJS_DB_USER: admin
      CUBEJS_DB_PASS: password123
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: super_secret_key_change_me_later
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: admin_cube
      CUBEJS_SQL_PASSWORD: cubepassword123
      CUBEJS_BIND_ADDRESS: "0.0.0.0"
    depends_on:
      - postgres

  # 3. THE VISUALIZATION LAYER (Metabase)
  metabase:
    image: metabase/metabase:v0.50.4
    container_name: analytics_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - cube

  # 4. THE NODE APPLICATION ORCHESTRATOR LAYER
  app:
    build: .
    container_name: analytics_node_app
    restart: always
    network_mode: "host"           # 🎯 KEEPS APPS LINKED TOGETHER
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 8000
      CUBE_API_URL: http://127.0.0.1:4000
      CUBE_API_TOKEN: super_secret_key_change_me_later
      ANTHROPIC_API_KEY: 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 # 👈 ENSURE YOUR KEY IS HERE
    depends_on:
      - cube

volumes:
  mbdata:
