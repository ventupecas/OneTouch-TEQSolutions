cubes:
  - name: sc_req_item
    sql_table: public.sc_req_item
    data_source: default

    joins: []

    dimensions:
      - name: stage
        sql: stage
        type: string

      - name: updated
        sql: updated
        type: string

      - name: approval_set
        sql: approval_set
        type: string

      - name: short_description
        sql: short_description
        type: string

      - name: number
        sql: number
        type: string

      - name: description
        sql: description
        type: string

      - name: approval
        sql: approval
        type: string

      - name: state
        sql: state
        type: string

      - name: closed
        sql: closed
        type: string

      - name: order_guide
        sql: order_guide
        type: string

      - name: request
        sql: request
        type: string

      - name: location
        sql: location
        type: string

      - name: requested_for
        sql: requested_for
        type: string

      - name: parent
        sql: parent
        type: string

      - name: work_notes
        sql: work_notes
        type: string

      - name: item
        sql: item
        type: string

      - name: approval_history
        sql: approval_history
        type: string

      - name: opened_by
        sql: opened_by
        type: string

      - name: opened
        sql: opened
        type: string

      - name: fulfilled_time
        sql: fulfilled_time
        type: string

      # --- derived date buckets (added for trend / per-period questions) ---
      - name: opened_day
        sql: "LEFT({CUBE}.opened, 10)"
        type: string

      - name: opened_month
        sql: "LEFT({CUBE}.opened, 7)"
        type: string

      - name: opened_week
        sql: "TO_CHAR(NULLIF({CUBE}.opened, '')::timestamp, 'IYYY-\"W\"IW')"
        type: string

      - name: closed_month
        sql: "LEFT({CUBE}.closed, 7)"
        type: string


    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

