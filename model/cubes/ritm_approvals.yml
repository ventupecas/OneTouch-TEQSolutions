cubes:
  - name: ritm_approvals
    sql_table: public.ritm_approvals
    data_source: default

    joins: []

    dimensions:
      - name: assignment_group
        sql: assignment_group
        type: string

      - name: parent
        sql: parent
        type: string

      - name: approval
        sql: approval
        type: string

      - name: state
        sql: state
        type: string

      - name: created
        sql: created
        type: string

      - name: short_description
        sql: short_description
        type: string

      - name: task_type
        sql: task_type
        type: string

      # --- derived date buckets (added for trend / per-period questions) ---
      - name: created_day
        sql: "LEFT({CUBE}.created, 10)"
        type: string

      - name: created_month
        sql: "LEFT({CUBE}.created, 7)"
        type: string

      - name: created_week
        sql: "TO_CHAR(NULLIF({CUBE}.created, '')::timestamp, 'IYYY-\"W\"IW')"
        type: string


    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

